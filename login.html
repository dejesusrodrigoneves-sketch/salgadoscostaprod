<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<title>Login - Fábrica de Salgados Costa</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/login-page.css">
</head>
<body>

<div class="container">
  <div class="brand">
    <div class="icon"><i class="fas fa-utensils"></i></div>
    <h1>SIC.ia</h1>
    <p>Sistema de Gerenciamento</p>
  </div>

  <div class="card">
    <!-- Login Tabs -->

    <!-- Login Form -->
    <div class="form-box active" id="boxLogin">
      <form id="loginForm" aria-label="Formulário de login">
        <div class="form-group">
          <label for="loginUser">Usuário</label>
          <input type="text" id="loginUser" placeholder="Seu usuário" required autocomplete="username" aria-required="true">
        </div>
        <div class="form-group">
          <label for="loginPass">Senha</label>
          <input type="password" id="loginPass" placeholder="Sua senha" required autocomplete="current-password" aria-required="true">
        </div>
        <button type="submit" class="btn btn-primary" id="btnLogin" aria-label="Entrar no sistema">
          <span class="spinner-btn"></span> Entrar <i class="fas fa-arrow-right" aria-hidden="true"></i>
        </button>
        <div class="error" id="loginError" role="alert"></div>
      </form>
    </div>

    <!-- Register disabled in single-tenant mode -->
  </div>

  <div class="footer">&copy; 2026 @djesus.programmer </div>
</div>

<script src="js/config.js?v=2"></script>
<script src="js/pages/login.js" defer></script>
<script src="js/password-toggle.js" defer></script>
<script src="js/theme.js" defer></script>
</body>
</html>
