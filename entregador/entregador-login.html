<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F26D3D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Entregador — Login</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/entregador.css">
  <style>
    .login-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background: var(--bg-primary);
    }
    .login-card { width: 100%; max-width: 320px; }
    .login-logo {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #F26D3D, #E85D2C);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      font-size: 32px; color: #fff;
    }
    .login-title { text-align: center; font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .login-sub { text-align: center; font-size: 13px; color: var(--text-secondary); margin-bottom: 24px; }
    .error-msg {
      display: none;
      background: var(--danger-bg);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 16px;
      text-align: center;
    }
    .error-msg.visible { display: block; }
    .spinner { display: none; }
    .btn-primary.loading .spinner { display: inline-block; margin-right: 8px; }
    .btn-primary.loading .btn-text { display: none; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo"><i class="bi bi-box-seam"></i></div>
      <h1 class="login-title">Entregador</h1>
      <p class="login-sub">Acesse seus pedidos</p>

      <div id="error" class="error-msg"></div>

      <form id="loginForm">
        <div class="input-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" placeholder="(00) 00000-0000" autocomplete="tel" inputmode="numeric" required>
        </div>
        <div class="input-group">
          <label for="password">Senha</label>
          <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">
          <span class="spinner"><i class="bi bi-arrow-repeat" style="animation:spin 1s linear infinite;"></i></span>
          <span class="btn-text">Entrar <i class="bi bi-arrow-right"></i></span>
        </button>
      </form>
    </div>
  </div>

  <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>

  <script>
    // Redirect if already authenticated
    const token = localStorage.getItem('entregador_token');
    const expiry = localStorage.getItem('entregador_expiry');
    if (token && expiry && Date.now() < Number(expiry)) {
      window.location.href = 'entregador-app.html';
    }

    const form = document.getElementById('loginForm');
    const errorEl = document.getElementById('error');
    const loginBtn = document.getElementById('loginBtn');

    // Phone mask
    const phoneInput = document.getElementById('telefone');
    phoneInput.addEventListener('input', (e) => {
      let v = e.target.value.replace(/\D/g, '').substring(0, 11);
      if (v.length > 6) {
        v = `(${v.substring(0,2)}) ${v.substring(2,7)}-${v.substring(7)}`;
      } else if (v.length > 2) {
        v = `(${v.substring(0,2)}) ${v.substring(2)}`;
      }
      e.target.value = v;
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('visible');
      loginBtn.classList.add('loading');
      loginBtn.disabled = true;

      const telefone = phoneInput.value.replace(/\D/g, '');
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/entregador/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ telefone, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Erro ao fazer login');
        }

        // Store auth data
        localStorage.setItem('entregador_token', data.token);
        localStorage.setItem('entregador_refresh', data.refreshToken);
        localStorage.setItem('entregador_user', JSON.stringify(data.user));
        localStorage.setItem('entregador_expiry', String(Date.now() + 30 * 60 * 1000)); // 30 min

        if (data.mustChangePassword) {
          window.location.href = 'entregador-app.html#/senha';
        } else {
          window.location.href = 'entregador-app.html';
        }
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        loginBtn.classList.remove('loading');
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
