<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title id="dashboardTitle">Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-visual">
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Ordem de cascata global (declarada ANTES de todo CSS local).
   vendor = bootstrap embrulhado em camada — unlayered venceria as camadas. */
@layer vendor, reset, tokens, shell, pages, utilities, overrides;
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/vendor/bootstrap.min.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/dashboard-page.css">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin/dashboard-shell.css">
<link rel="stylesheet" href="css/admin/hungry-tiger.css">
<style>
/* Superadmin: sidebar externa ocultada — usa sa-sidebar interna no iframe */
body.role-superadmin .sidebar { display: none; }
body.role-superadmin .sidebar-overlay { display: none; }
body.role-superadmin .main { margin-left: 0; }
body.role-superadmin .topbar-left .mobile-toggle { display: none; }
</style>

</head>
<body>

<div class="app">
  <!-- Sidebar overlay for mobile -->
  <div class="sidebar-overlay" id="sidebarOverlay" data-action="closeSidebarAction"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon"><i class="fas fa-utensils"></i></div>
      <h2 id="sidebarStoreName"><small>Painel Administrativo</small></h2>
    </div>
    <nav class="sidebar-nav" id="sidebarNav">
      <!-- Sections rendered by JS -->
    </nav>
    <button class="sidebar-collapse-btn" data-action="toggleSidebarCollapseAction" title="Recolher menu" aria-label="Recolher menu lateral">
      <i class="fas fa-angles-left" aria-hidden="true"></i>
    </button>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="mobile-toggle" data-action="toggleSidebarAction" aria-label="Abrir menu">
          <i class="fas fa-bars"></i>
        </button>
        <h1 id="pageTitle">Pedidos</h1>
      </div>
      <div class="topbar-right">
        <span class="user-info" id="userInfo"><i class="fas fa-user-circle"></i> Admin</span>
        <button class="btn-logout" data-action="logoutAction" aria-label="Sair do sistema"><i class="fas fa-sign-out-alt" aria-hidden="true"></i> Sair</button>
      </div>
    </header>

    <div class="content">
      <div class="page-loader" id="pageLoader">
        <div class="spinner"></div>
        <p>Carregando...</p>
      </div>
      <div id="pageContainer"></div>
    </div>
  </div>
</div>

<!-- Notification container -->
<div class="notif-container" id="notifContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/config.js?v=3"></script>
<script src="js/loading.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth/session.js"></script>
<script src="js/delegator.js"></script>
<script type="module" src="js/pages/dashboard.mjs"></script>
<script src="js/router.js" defer></script>
<script src="js/theme.js" defer></script>
<script src="js/subscriptionOverlay.js"></script>
<script src="js/filialPricingOverlay.js"></script>
</body>
</html>
